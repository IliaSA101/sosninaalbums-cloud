---
# Вход администратора по паролю отвергнут демоном: ключ отключён, предлагается только пароль; в ответе sshd
# среди допустимых методов — один publickey. Проверка с контроллера (как стендовый verify_ssh_password_denied),
# но в самой раскатке: sshd -T читает диск, а это — живой демон после reload. Пароль в проверке не участвует:
# BatchMode не даёт ssh его спросить.
- name: Вход по паролю администратора отвергнут демоном
  delegate_to: localhost
  become: false
  vars:
    ansible_remote_tmp: /tmp/.ansible-probe
  ansible.builtin.command:
    argv: >-
      {{ ['ssh'] + sa_ssh_args + ['-o', 'BatchMode=yes', '-o', 'ConnectTimeout=10', '-o', 'ControlMaster=no',
      '-o', 'ControlPath=none', '-o', 'PubkeyAuthentication=no',
      '-o', 'PreferredAuthentications=password,keyboard-interactive',
      '-p', bootstrap_ssh_port | string, admin_user ~ '@' ~ bootstrap_ssh_target, 'true'] }}
  register: bootstrap_pw_probe
  changed_when: false
  failed_when: bootstrap_pw_probe.rc != 255 or 'Permission denied (publickey)' not in bootstrap_pw_probe.stderr
