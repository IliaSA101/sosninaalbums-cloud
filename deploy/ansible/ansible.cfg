# Настройки контроллера раскатки (design 002 §4). Запуск — с ANSIBLE_CONFIG на этот файл: из каталога
# «для всех» Ansible конфиг не читает, а права на смонтированный каталог зависят от того, откуда клон.
[defaults]
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# Интерпретатор — путь, а не поиск по PATH: PATH администратора (~/.bashrc) не должен выбирать, какой python3
# выполнится от root. Проверка файлов запуска администратора — verify_users (роль bootstrap).
interpreter_python = /usr/bin/python3
# Модули под не-root идут по ACL (пакет acl ставит роль bootstrap), а не через файлы «для всех».
allow_world_readable_tmpfiles = False

[privilege_escalation]
become_exe = /usr/bin/sudo

[connection]
# Модули идут через stdin, без временных файлов с аргументами (там были бы секреты). Секция [connection], а не
# только [ssh_connection]: пробный вход администратора идёт через delegate_to: localhost (соединение local),
# и аргументы вроде stdin с паролем легли бы файлом в tmp контроллера.
pipelining = True

[ssh_connection]
pipelining = True
# Мультиплексирование: уже открытая сессия переживает перезагрузку sshd с новым 00-sa.conf, поэтому
# остаток прогона не зависит от AllowUsers (design §7).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
