# /etc/systemd/system/caddy.service.d/albums.conf — drop-in для Caddy из официального apt-репозитория Caddy.
# Доступ к сокету сервиса даёт ACL на /run/albums-svc (albums-svc.tmpfiles.conf), группа не нужна.
# EnvironmentFile ставит роль Ansible: ALBUMS_DOMAIN=<домен из inventory>; сам файл — 0640 root:caddy.
#
# Caddy — единственный процесс, который разбирает чужой интернет, поэтому права сужены (design 002 §8, И4-7):
# только привязка к портам 80 и 443; без повышения прав, без домашних каталогов, без настройки ядра, без
# пространств имён, без устройств, только сокеты IP/Unix/netlink, обычные системные вызовы своей архитектуры.
# CAP_NET_ADMIN пакетного юнита нужен Caddy лишь для буферов UDP HTTP/3, а HTTP/3 выключен (protocols h1 h2):
# когда его включат, понадобятся sysctl net.core.rmem_max и wmem_max. ExecStart — без --environ: окружение процесса (в нём домен) не печатается в журнал.
[Service]
EnvironmentFile=/etc/caddy/albums.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
RestrictNamespaces=yes
SystemCallFilter=@system-service
SystemCallArchitectures=native
PrivateDevices=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
LockPersonality=yes
