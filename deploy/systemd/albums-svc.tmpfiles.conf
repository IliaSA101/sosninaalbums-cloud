# /etc/tmpfiles.d/albums-svc.conf — каталог сокета между Caddy и контейнером albums-svc.
# /run — tmpfs, поэтому каталог создаётся при каждой загрузке (до старта пользовательских юнитов).
# Владелец при создании — пользователь `albums`; перед стартом контейнера юнит меняет владельца на uid
# сервиса в карте subuid (ExecStartPre в Quadlet), ACL при этом сохраняется. Caddy в группу `albums` не
# входит: ему выдано ровно то, что нужно для сокета — проход по каталогу (x) и rw на новые файлы в нём
# (default ACL наследуется сокетом; сервис ставит ему 0660). Всем остальным каталог закрыт (0750).
d /run/albums-svc 0750 albums albums -
a+ /run/albums-svc - - - - u:caddy:x,d:u:caddy:rw
