---
# Намеренно плохой образец для selftest: restart и stop nftables сбрасывают правила (nft flush ruleset).
- name: Перезапустить nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted

- name: Остановить в цикле
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: [nftables]

- name: Остановить командой
  ansible.builtin.command: systemctl stop nftables
  changed_when: true

- name: Сбросить таблицу командой
  ansible.builtin.command: nft flush table inet sa_filter
  changed_when: true

- name: Удалить таблицу командой
  ansible.builtin.shell:
    cmd: nft delete table inet sa_filter
  changed_when: true

- name: Остановить через argv
  ansible.builtin.command:
    argv: [systemctl, stop, nftables]
  changed_when: true
