<!doctype html>
<!-- Шаблон html/template: страницу альбома /a/<id>/ отдаёт сервис. Подстановки: .Assets — префикс каталога
     листалки с хэшем содержимого («/viewer/<хэш>/»), .Studio — подпись студии из конфига. Название альбома сюда
     не попадает: его рисует app.js из manifest.json (боты и предпросмотр ссылок не получают ПД). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Альбом{{if .Studio}} · {{.Studio}}{{end}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="{{.Assets}}icon.svg">
<link rel="stylesheet" href="{{.Assets}}viewer.css">
<link rel="stylesheet" href="{{.Assets}}vendor/page-flip-2.0.7.css">
</head>
<body class="viewer">
<header class="bar">
  <h1 id="title" class="bar-title"></h1>
  <p id="studio" class="bar-studio"></p>
  <button id="full" class="fs" type="button" aria-label="На весь экран" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</header>
<main id="stage" class="stage">
  <p id="status" class="status" role="status">Загружаем альбом…</p>
  <noscript><p class="status">Для просмотра альбома нужен JavaScript.</p></noscript>
</main>
<p id="rotate" class="rotate" hidden>
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M18 12h.01"/></svg>
  <span>Поверните телефон, чтобы увидеть разворот целиком</span>
</p>
<footer class="controls">
  <button id="prev" class="nav" type="button" aria-label="Назад" disabled>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="counter" aria-live="polite">
    <span id="counter" class="counter-main"></span>
    <small id="counter-sub" class="counter-sub"></small>
  </div>
  <button id="next" class="nav" type="button" aria-label="Вперёд" disabled>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</footer>
<script type="module" src="{{.Assets}}app.js"></script>
</body>
</html>
