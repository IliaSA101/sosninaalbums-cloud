name: Release

# Выпуск образа albums-svc (design 004): только push метки vX.Y.Z (лёгкая, на коммите из main). Подпись и права
# записи у отдельных заданий; permissions: {} наверху — у остальных нет ничего, что не названо явно. Файл читают
# целиком в review.sh, а проверяет workflow_guard.py (в CI и в image-verify на ops-ВМ), поэтому он мал и однообразен:
# run: только вызовы deploy/release/*, выражения только из перечня, без if:, кроме выхода из реестра.
# Запасной путь, если GITHUB_TOKEN не создаст пакет (design §9): environment: release у release-publish и
# secrets.RELEASE_PACKAGES_TOKEN вместо GITHUB_TOKEN в env: TOKEN — отдельным выпуском, после «да» владельца.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# Прогон выпуска не отменяется: полупубликация хуже ожидания.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Формат метки, событие и коммит из main
        run: bash deploy/release/gate.sh

  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      version: ${{ github.ref }}

  release-publish:
    needs: [release-gate, checks]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # Архив - в runner.temp, код публикации - из sparse-checkout в подкаталог после скачивания (design 004 §5).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: albums-svc-oci
          path: ${{ runner.temp }}/release-oci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/release
          path: src
          persist-credentials: false

      - name: Вход в реестр
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash src/deploy/release/registry.sh login

      - name: Публикация образа по D из build-image
        env:
          SA_AUTHFILE: ${{ runner.temp }}/auth.json
          SA_ARCHIVE: ${{ runner.temp }}/release-oci/albums-svc.oci.tar
          SA_DIGEST: ${{ needs.checks.outputs.digest }}
          SA_OUT_DIR: ${{ runner.temp }}/release-manifest
          SA_REPO: ghcr.io/iliasa101/albums-svc
        run: bash src/deploy/release/publish.sh "$SA_ARCHIVE" "$SA_DIGEST" "$SA_REPO" "$GITHUB_REF_NAME"

      # Единственный if: выпуска. Выход - до загрузки публичного артефакта; провал публикации его не отменяет.
      - name: Выход из реестра
        if: always()
        run: bash src/deploy/release/registry.sh logout

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release-manifest/release.manifest.json
          if-no-files-found: error

  # Подпись. Без checkout и скачиваний: D - только вывод build-image (needs.checks), ничего из release-publish.
  # Первый шаг - сверка раннеров; сертификат удостоверяет само это задание, поэтому сверка живёт в нём.
  release-attest:
    needs: [release-gate, checks, release-publish]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Сверка раннеров прогона через API
        env:
          GH_TOKEN: ${{ github.token }}
          SA_REQUIRED_JOBS: checks / build-image;checks / stand-full;release-publish
        run: |
          out="$RUNNER_TEMP/runner-jobs.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" >"$out"
          python3 -I - "$out" <<'PY'
          import json, os, sys
          # GitHub-hosted runner group: values are from memory (design 004 section 10), confirm on ci/*.
          GROUP_ID = 0
          GROUP_NAME = "GitHub Actions"
          required = [s for s in os.environ["SA_REQUIRED_JOBS"].split(";") if s]
          me = os.environ.get("GITHUB_JOB", "")
          text = open(sys.argv[1], encoding="utf-8").read()
          dec, pos, jobs = json.JSONDecoder(), 0, []
          while True:
              while pos < len(text) and text[pos].isspace():
                  pos += 1
              if pos >= len(text):
                  break
              page, pos = dec.raw_decode(text, pos)
              jobs.extend(page.get("jobs") or [])
          bad, seen = [], set()
          if not jobs:
              bad.append("empty answer")
          for j in jobs:
              name = str(j.get("name"))
              if name == me and j.get("status") == "in_progress":
                  continue
              if j.get("runner_id") is None and not j.get("runner_name"):
                  if j.get("conclusion") not in ("skipped", "cancelled"):
                      bad.append(name + ": no runner, conclusion " + str(j.get("conclusion")))
                  continue
              if j.get("runner_group_id") != GROUP_ID or j.get("runner_group_name") != GROUP_NAME:
                  bad.append(name + ": runner group " + str(j.get("runner_group_id")) + " / " + str(j.get("runner_group_name")))
              if j.get("conclusion") == "success":
                  seen.add(name)
          bad += ["missing job with success: " + r for r in required if r not in seen]
          for line in bad:
              print("runner-check: " + line, file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-name: ghcr.io/iliasa101/albums-svc
          subject-digest: ${{ needs.checks.outputs.digest }}
          push-to-registry: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
