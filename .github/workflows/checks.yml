name: Checks

# Общие проверки (design 004 §1): зовутся из ci.yml (ветки ci/**) и из release.yml (метка vX.Y.Z); сами не
# запускаются. Подписи и публикации здесь нет — только проверки и сборка архива образа.
on:
  workflow_call:
    inputs:
      version:
        description: refs/tags/vX.Y.Z для выпуска или ci для ветки проверок
        required: true
        type: string
    outputs:
      digest:
        description: Дайджест образа, собранного заданием build-image
        value: ${{ jobs.build-image.outputs.digest }}

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Версия — из go.mod (go + toolchain), как её читает scripts/check.sh. cache: false — go.sum пока нет,
      # а кэш без него даёт предупреждение; ноль warnings — правило проекта.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          package-manager-cache: false

      # Те же версии, что на машине разработки. check.sh ищет их в GOPATH/bin, поэтому go install.
      - name: golangci-lint и govulncheck
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Бинарник с проверкой sha256 (значение — из метаданных релиза): подмена архива не пройдёт.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Инварианты workflow (design 004 §2): тот же скрипт, что в ops-ВМ. PyYAML — из requirements.txt с хэшами
      # в отдельном venv; строка совпадает со строкой контроллера Ansible (проверяет сам скрипт).
      - name: инварианты workflow
        run: |
          git ls-tree -r -z --name-only HEAD >"$RUNNER_TEMP/paths"
          python3 -m venv "$RUNNER_TEMP/wfg"
          "$RUNNER_TEMP/wfg/bin/pip" install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r deploy/release/requirements.txt
          "$RUNNER_TEMP/wfg/bin/python" -I deploy/release/workflow_guard.py --root . --paths "$RUNNER_TEMP/paths"

      # Архив gh для image_verify_cases (спека 004, И6b): версия и sha256 - из deploy/ops/tools.env (файл И6b). Файл
      # разбирается построчно, не исполняется. Нет файла - провал, а не пустой зелёный: пока И6b не слита в dev, этот шаг
      # ожидаемо красный (так задумано, 004-34). Скачивание - только в задании check: в заданиях выпуска его нет.
      - name: архив gh для проверки аттестации
        run: |
          env_file=deploy/ops/tools.env
          if [ ! -f "$env_file" ]; then
            echo "нет deploy/ops/tools.env (файл И6b): без него image_verify_cases не выполнить"
            exit 1
          fi
          version=$(sed -n 's/^GH_VERSION="\{0,1\}\([0-9][0-9.]*\)"\{0,1\}$/\1/p' "$env_file")
          sha=$(sed -n 's/^GH_SHA256="\{0,1\}\([0-9a-f]\{64\}\)"\{0,1\}$/\1/p' "$env_file")
          if [ -z "$version" ] || [ -z "$sha" ]; then
            echo "tools.env: нет GH_VERSION или GH_SHA256"
            exit 1
          fi
          dir=.gotmp/provision/gh
          file="$dir/gh_${version}_linux_amd64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL -o "$file" "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_amd64.tar.gz"
          echo "$sha  $file" | sha256sum --check --strict

      # shellcheck есть в образе ubuntu-24.04; версию печатаем, чтобы расхождение с локальной было видно в логе.
      - name: версии инструментов
        run: |
          go version
          node --version
          shellcheck --version | sed -n 2p
          gitleaks version
          "$(go env GOPATH)/bin/golangci-lint" --version
          "$(go env GOPATH)/bin/govulncheck" -version | head -n 1

      # --race: gcc на раннере есть; --vuln: уязвимости в зависимостях. Полный набор, без послаблений.
      - name: scripts/check.sh
        run: scripts/check.sh --race --vuln

      # Случаи ci-push.mjs пока не входят в check.sh (правка check.sh — за оркестратором); когда войдут, шаг убрать.
      - name: случаи ci-push
        run: node scripts/ci-push-cases.mjs

  # Образ выпуска (design 004 §3): единственное место, где задаётся D. Без кода стенда, Ansible и сторонних
  # образов, кроме двух баз Containerfile по дайджесту. Состав сверяет эталон image_check.py до загрузки.
  build-image:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Сборка образа, архив и эталон состава
        id: build
        env:
          SA_VERSION_REF: ${{ inputs.version }}
          SA_ARCHIVE: ${{ runner.temp }}/oci/albums-svc.oci.tar
        run: bash deploy/release/build.sh "$SA_ARCHIVE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: albums-svc-oci
          path: ${{ runner.temp }}/oci/albums-svc.oci.tar
          if-no-files-found: error
          retention-days: 7

  # Полный стенд раскатки (design 002 §12, П2): цель Debian 13 с systemd в rootful Podman раннера, все роли с
  # albums-runtime (linger, ACL, образ по дайджесту, Quadlet, healthcheck), /v1/health от caddy, перезапуск цели,
  # поток копии и все мутации. Образ сервиса — архив задания build-image (deploy/Containerfile собирается один раз), в одноразовый реестр
  # стенда его кладёт publish.sh. Секретов нет: ключи,
  # пароли vault и age стенда — случайные на запуск, в $RUNNER_TEMP. SKIP любого шага — провал (deploy/tests/provision/ci.sh).
  stand-full:
    needs: [build-image]
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: albums-svc-oci
          path: ${{ runner.temp }}/oci

      - name: Podman раннера, сеть, диапазон subuid
        run: bash deploy/tests/provision/ci.sh prepare

      # Образ — архив build-image (design 004 §4): стенд ничего не собирает и не выгружает, а проверяет тот же
      # файл и может лишь сказать «нет» (дайджест архива обязан быть D).
      - name: Цель и образ сервиса
        env:
          SA_IMAGE_ARCHIVE: ${{ runner.temp }}/oci/albums-svc.oci.tar
          SA_IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          bash deploy/tests/provision/ci.sh run up
          bash deploy/tests/provision/ci.sh run converge_image

      - name: converge (bootstrap, site с albums-runtime)
        run: |
          bash deploy/tests/provision/ci.sh run converge_bootstrap
          bash deploy/tests/provision/ci.sh run converge_site

      - name: idempotence_full
        run: bash deploy/tests/provision/ci.sh run idempotence_full

      - name: Проверки хоста и сервиса
        run: |
          rc=0
          for step in verify_ssh verify_nft verify_host verify_acl verify_service verify_health; do
            bash deploy/tests/provision/ci.sh run "$step" || rc=1
          done
          exit "$rc"

      - name: Перезапуск цели и поток копии
        run: |
          bash deploy/tests/provision/ci.sh run verify_after_restart
          bash deploy/tests/provision/ci.sh run verify_backup_stream

      - name: Мутации
        run: |
          rc=0
          for step in mutate_restore_a mutate_restore_b mutate_restore_c mutate_restore_d mutate_caddy mutate_caddy_b \
            mutate_policy mutate_host mutate_backup; do
            bash deploy/tests/provision/ci.sh run "$step" || rc=1
          done
          exit "$rc"
